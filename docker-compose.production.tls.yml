# Overlay for TLS terminated by this nginx.
# docker compose -f docker-compose.production.yml -f docker-compose.production.tls.yml --profile tls up --build
# TLS_CERT_DIR is a directory outside the repository with fullchain.pem and privkey.pem.

services:
  proxy-tls:
    profiles: ['tls']
    image: nginx:1.27-alpine
    container_name: ravion-prod-proxy-tls
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./deploy/nginx/proxy-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR}:/etc/nginx/certs:ro
    networks:
      - edge

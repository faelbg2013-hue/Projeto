# Production-shaped stack. It does not use the development Compose project,
# volume, database name, or development seed.
# Provide secrets in the shell or a file that is not committed.
# Public internet traffic must use HTTPS. The default publish is HTTP on 8080
# so a local check can run without a certificate.
# TLS in this nginx uses docker-compose.production.tls.yml.

name: ravion-barber-production

services:
  mysql:
    image: mysql:8.4
    container_name: ravion-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:-ravion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - ravion_production_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: ravion-barber-api:local
    container_name: ravion-prod-migrate
    restart: 'no'
    # The runtime image has the Prisma CLI, schema, and migrations. It does not include pnpm.
    entrypoint: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-ravion}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: ravion-barber-api:local
    container_name: ravion-prod-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 43111
      DATABASE_URL: mysql://${MYSQL_USER:-ravion}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      DEFAULT_PUBLIC_TENANT_ID: ${DEFAULT_PUBLIC_TENANT_ID:?Set DEFAULT_PUBLIC_TENANT_ID}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SWAGGER_ENABLED: 'false'
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      LOG_LEVEL: ${LOG_LEVEL:-log}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:43111/api/v1/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - edge
      - data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ravion-barber-web:local
    container_name: ravion-prod-web
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - edge

  proxy:
    image: nginx:1.27-alpine
    container_name: ravion-prod-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./deploy/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge

networks:
  edge:
  data:

volumes:
  ravion_production_mysql:

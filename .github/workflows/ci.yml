name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ravion_barber_ci
          MYSQL_USER: ravion_ci
          MYSQL_PASSWORD: ravion_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=30s
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ravion_ci:ravion_ci_password@127.0.0.1:3306/ravion_barber_ci
      JWT_SECRET: ci-only-jwt-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-jwt-refresh-secret-not-for-production
      DEFAULT_PUBLIC_TENANT_ID: 3f1c2a7e-6b4d-4e8a-9c21-0a1b2c3d4e5f
      TRUST_PROXY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Same-origin production URL for the PWA build
        run: printf 'VITE_API_URL=\n' > .env.production

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Prisma validate
        run: pnpm prisma:validate

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test shared packages
        run: pnpm --filter @ravion/ui test && pnpm --filter @ravion/types test && pnpm --filter @ravion/validation test

      - name: Test API
        run: pnpm --filter @ravion/api exec vitest run --no-file-parallelism

      # auth-flow.spec.tsx fails on AbortSignal: React Router + undici versus jsdom.
      # This is the only excluded frontend file. Do not broaden the exclude.
      - name: Test PWA
        run: pnpm --filter @ravion/web exec vitest run --no-file-parallelism --exclude src/routes/auth-flow.spec.tsx

      - name: Build
        run: pnpm build

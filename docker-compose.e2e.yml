name: ravion-e2e

services:
  mysql:
    image: mysql:8.4
    container_name: ravion-e2e-mysql
    ports:
      - '127.0.0.1:33116:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${E2E_MYSQL_ROOT_PASSWORD:-ravion_e2e_root_local}
      MYSQL_DATABASE: ravion_e2e
      MYSQL_USER: ravion_e2e
      MYSQL_PASSWORD: ${E2E_MYSQL_PASSWORD:-ravion_e2e_local_only}
    volumes:
      - ravion_e2e_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uravion_e2e -p$$MYSQL_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  ravion_e2e_mysql:

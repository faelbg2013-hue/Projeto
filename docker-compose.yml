name: ravion-barber

services:
  mysql:
    image: mysql:8.4
    container_name: ravion-barber-mysql
    restart: unless-stopped
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ravion_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ravion_barber}
      MYSQL_USER: ${MYSQL_USER:-ravion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ravion_dev_password}
    volumes:
      - ravion_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  ravion_mysql_data:
